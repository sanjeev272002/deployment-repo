apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-app
  labels:
    app: microservice-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice-app
  template:
    metadata:
      labels:
        app: microservice-app
    spec:
      containers:
      - name: microservice-container
        image: 230254492998.dkr.ecr.ap-southeast-2.amazonaws.com/myecrrepo:latest
        ports:
        - containerPort: 80
